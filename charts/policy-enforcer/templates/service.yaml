{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "policy-enforcer.fullname" . }}
  labels:
    {{- include "policy-enforcer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "policy-enforcer.selectorLabels" . | nindent 4 }}
{{- end }}