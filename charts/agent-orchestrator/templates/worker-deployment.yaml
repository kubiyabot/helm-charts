{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.fullname" . }}-worker
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "control-plane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "control-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["python scripts/seed_worker_queues.py && python control_plane_api/worker/worker.py"]
          env:
            # Hardcoded (static, framework requirement)
            - name: PYTHONUNBUFFERED
              value: "1"
            # OTEL - derived from values with defaults
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | default (include "control-plane.fullname" .) | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | default (printf "service.name=%s" (include "control-plane.fullname" .)) | quote }}
            {{- /* Construct the default environment dictionary */ -}}
            {{- $defaultEnv := dict -}}
            {{- /* 1. Global Defaults */ -}}
            {{- if .Values.global }}
              {{- if .Values.global.environment }}
                {{- $_ := set $defaultEnv "ENVIRONMENT" .Values.global.environment -}}
              {{- end }}
              {{- if .Values.global.logLevel }}
                {{- $_ := set $defaultEnv "LOG_LEVEL" .Values.global.logLevel -}}
              {{- end }}
            {{- if .Values.global.policyEnforcer }}
              {{- if .Values.global.policyEnforcer.enabled }}
                {{- $_ := set $defaultEnv "ENFORCER_SERVICE_URL" (printf "http://%s-policy-enforcer:5001" .Release.Name) -}}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- /* 2. Smart Service Discovery Defaults */ -}}
            {{- $_ := set $defaultEnv "GRAPH_API_URL" (printf "http://%s-agent-memory:80" .Release.Name) -}}
            {{- $_ := set $defaultEnv "LITELLM_API_BASE" (printf "http://%s-litellm:4000" .Release.Name) -}}
            {{- /* 3. Merge with Values.env (Values.env takes precedence) */ -}}
            {{- $finalEnv := merge (deepCopy .Values.env) $defaultEnv -}}
            {{- range $key, $value := $finalEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.global }}
            {{- if .Values.global.existingSecret }}
            - secretRef:
                name: {{ .Values.global.existingSecret }}
            {{- end }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
