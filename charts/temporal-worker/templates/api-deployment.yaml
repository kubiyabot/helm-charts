{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal-worker.fullname" . }}-api
  labels:
    {{- include "temporal-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "temporal-worker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "temporal-worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "temporal-worker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "temporal_app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            # Hardcoded (static, framework requirement)
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- /* Construct the default environment dictionary */ -}}
            {{- $defaultEnv := dict -}}
            {{- /* 1. Global Defaults */ -}}
            {{- if .Values.global }}
              {{- if .Values.global.environment }}
                {{- $_ := set $defaultEnv "ENVIRONMENT" .Values.global.environment -}}
              {{- end }}
              {{- if .Values.global.logLevel }}
                {{- $_ := set $defaultEnv "LOG_LEVEL" .Values.global.logLevel -}}
              {{- end }}
            {{- end }}
            {{- /* 2. Smart Service Discovery Defaults */ -}}
            {{- $_ := set $defaultEnv "CONTROL_PLANE_API_URL" (printf "http://%s-control-plane-api:80" .Release.Name) -}}
            {{- $_ := set $defaultEnv "GRAPH_API_URL" (printf "http://%s-context-graph:80" .Release.Name) -}}
            {{- $_ := set $defaultEnv "LITELLM_API_BASE" (printf "http://%s-litellm:4000" .Release.Name) -}}
            {{- /* 3. Merge with Values.env (Values.env takes precedence) */ -}}
            {{- $finalEnv := merge (deepCopy .Values.env) $defaultEnv -}}
            {{- range $key, $val := $finalEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.global }}
            {{- if .Values.global.existingSecret }}
            - secretRef:
                name: {{ .Values.global.existingSecret }}
            {{- end }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
