{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.fullname" . }}-api
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "control-plane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "control-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          env:
            # Hardcoded (static, framework requirement)
            - name: PYTHONUNBUFFERED
              value: "1"
            # OTEL - derived from values with defaults
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | default (include "control-plane.fullname" .) | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | default (printf "service.name=%s" (include "control-plane.fullname" .)) | quote }}
            {{- /* Construct the default environment dictionary */ -}}
            {{- $defaultEnv := dict -}}
            {{- /* 1. Global Defaults */ -}}
            {{- if .Values.global }}
              {{- if .Values.global.environment }}
                {{- $_ := set $defaultEnv "ENVIRONMENT" .Values.global.environment -}}
              {{- end }}
              {{- if .Values.global.logLevel }}
                {{- $_ := set $defaultEnv "LOG_LEVEL" .Values.global.logLevel -}}
              {{- end }}
            {{- end }}
            {{- /* 2. Smart Service Discovery Defaults */ -}}
            {{- $_ := set $defaultEnv "GRAPH_API_URL" (printf "http://%s-context-graph:80" .Release.Name) -}}
            {{- $_ := set $defaultEnv "LITELLM_API_BASE" (printf "http://%s-litellm:4000" .Release.Name) -}}
            {{- /* 3. Merge with Values.env (Values.env takes precedence) */ -}}
            {{- $finalEnv := merge (deepCopy .Values.env) $defaultEnv -}}
            {{- range $key, $value := $finalEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.global }}
            {{- if .Values.global.existingSecret }}
            - secretRef:
                name: {{ .Values.global.existingSecret }}
            {{- end }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
