# Minimal CI test configuration for kubiya-stack umbrella chart
# Used by: helm lint, helm template, CI pipelines

# Global test settings
global:
  security:
    allowInsecureImages: true
  policyEnforcer:
    enabled: true

# Agent Orchestrator - minimal config
agent-orchestrator:
  api:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ingress:
      enabled: false
  worker:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  autoscaling:
    enabled: false
  affinity: {}
  envFrom:
    - secretRef:
        name: agent-orchestrator-test-secrets

# Background Jobs - minimal config
background-jobs:
  api:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ingress:
      enabled: false
  worker:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  autoscaling:
    enabled: false
  affinity: {}
  envFrom:
    - secretRef:
        name: background-jobs-test-secrets

# Agent Memory - disabled by default, can enable for full stack test
agent-memory:
  enabled: false

# Policy Enforcer - enabled for integration coverage
policy-enforcer:
  enabled: true

# PostgreSQL - minimal config
postgresql:
  enabled: true
  auth:
    username: test
    password: test
    database: test
  primary:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    persistence:
      enabled: false

# Redis - minimal config
redis:
  enabled: true
  auth:
    enabled: false
  master:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    persistence:
      enabled: false
  replica:
    replicaCount: 0

# Neo4j - disabled for minimal tests
neo4j:
  enabled: false

# LiteLLM - disabled for minimal tests
litellm:
  enabled: false
