# Kubiya Stack Values

# Global settings
global:
  environment: "production"
  logLevel: "INFO"
  existingSecret: "kubiya-stack-secrets"
  security:
    # Required for non-Bitnami images like pgvector
    allowInsecureImages: true
  policyEnforcer:
    enabled: false  # Set true when policy-enforcer.enabled is true to auto-wire ENFORCER_SERVICE_URL

# ==============================================================================
# 1. Kubiya Components
# ==============================================================================

# Agent Orchestrator (formerly Control Plane)
agent-orchestrator:
  enabled: true
  api:
    enabled: true
    replicaCount: 2
  worker:
    enabled: true
    replicaCount: 2
  # OTEL config (derived from release name by default)
  otel:
    serviceName: ""  # Default: kubiya-stack-agent-orchestrator
    resourceAttributes: ""  # Default: service.name=kubiya-stack-agent-orchestrator
  # Environment variables
  # Note: PYTHONUNBUFFERED, OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES are hardcoded/derived
  # Note: ENVIRONMENT, LOG_LEVEL, GRAPH_API_URL, LITELLM_API_BASE handled by global defaults
  env:
    WEBSOCKET_ENABLED: "true"
  envFrom: []

# Background Jobs (formerly Temporal Worker)
# Executes background workflows and long-running tasks
background-jobs:
  enabled: true
  api:
    enabled: true
  worker:
    enabled: true
  # Inter-service URLs
  env:
    TEMPORAL_NAMESPACE: "default"
    TASK_QUEUE: "background-jobs"
    MAX_CONCURRENT_ACTIVITIES: "10"
    MAX_CONCURRENT_WORKFLOW_TASKS: "10"
    LOG_FORMAT: "json"
    # Note: LOG_LEVEL, ENVIRONMENT, URLs handled by global defaults
  envFrom: []

# Agent Memory (formerly Context Graph)
# Requires Neo4j when enabled
agent-memory:
  enabled: false  # Disabled by default to save resources
  # Important: If enabled, you must also enable neo4j below OR provide external NEO4J_URI
  # Note: PORT, PYTHONUNBUFFERED, *_ROOT_DIRECTORY are hardcoded in templates
  env: []
  # Note: ENVIRONMENT, LOG_LEVEL, CONTROL_PLANE_API_BASE handled by global defaults
  envFrom: []

# Policy Enforcer (OPA Watchdog)
policy-enforcer:
  enabled: false
  env: {}

# LiteLLM - AI Gateway / Proxy
# Multi-provider LLM access (OpenAI, Claude, etc.)
litellm:
  enabled: false
  # See official LiteLLM chart values for config
  # master_key: "sk-..."

# ==============================================================================
# 2. Infrastructure Dependencies
# ==============================================================================

# PostgreSQL
# Required by: agent-orchestrator, agent-memory
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: ankane/pgvector
    tag: v0.5.1
  global:
    postgresql:
      auth:
        database: agent_control_plane
        username: postgres
        password: "change-me"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    initdb:
      scripts:
        enable_vector.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;

# Redis
# Required by: agent-orchestrator
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# Neo4j
# Required by: agent-memory (ONLY)
# If agent-memory.enabled is false, this can be false.
neo4j:
  enabled: false
  neo4j:
    edition: community
    acceptLicenseAgreement: "yes"
    password: "change-me"
    env:
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_PLUGINS: '["apoc"]'
