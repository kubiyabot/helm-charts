# Lint Helm Charts on all branches except main
name: Lint Charts

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches-ignore:
      - 'main'

permissions:
  contents: write

jobs:
  helm-ci:
    name: Lint Charts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
         
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.3

      - name: Add Helm Repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add neo4j https://helm.neo4j.com/neo4j
          helm repo update

      - name: Update Helm Dependencies
        run: |
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm dependency update "$chart"
            fi
          done
      
      - name: Lint Helm Charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "=== Linting $chart ==="
              helm lint "$chart"

              # Lint with test values if they exist
              if [ -f "$chart/ci/test-values.yaml" ]; then
                echo "=== Linting $chart with test values ==="
                helm lint "$chart" -f "$chart/ci/test-values.yaml"
              fi
            fi
          done

      - name: Template Helm Charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "=== Templating $chart ==="
              # Use test values if available
              if [ -f "$chart/ci/test-values.yaml" ]; then
                helm template test "$chart" -f "$chart/ci/test-values.yaml" > /dev/null
              else
                helm template test "$chart" > /dev/null
              fi
              echo "✓ $chart templates successfully"
            fi
          done
