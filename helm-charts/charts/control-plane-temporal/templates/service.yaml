{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "control-plane-temporal.fullname" . }}
  labels:
    {{- include "control-plane-temporal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "control-plane-temporal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
