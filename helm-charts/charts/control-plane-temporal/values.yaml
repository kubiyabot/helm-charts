# Default values for control-plane-temporal.

image:
  repository: control-plane-temporal
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# API Service Configuration
api:
  enabled: true
  replicaCount: 1
  command: ["uvicorn", "temporal_app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# Worker Configuration
worker:
  enabled: true
  replicaCount: 1
  command: ["python", "-m", "temporal_app.worker"]
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

# Common Environment Variables
env:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Temporal Configuration
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TASK_QUEUE: "background-jobs"

  # Worker Tuning
  MAX_CONCURRENT_ACTIVITIES: "10"
  MAX_CONCURRENT_WORKFLOW_TASKS: "10"

  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_CORS_ORIGINS: "*"

# Secrets / Sensitive Env Vars
# These can be supplied via a Secret (referenced in extraEnvFrom) or set here (not recommended for gitops)
envSecrets: {}
  # KUBIYA_API_KEY: "value"
  # LITELLM_API_KEY: "value"
  # GRAPH_API_URL: "value"

nodeSelector: {}

tolerations: []

affinity: {}
